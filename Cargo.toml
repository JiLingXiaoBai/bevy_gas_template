[package]
name = "bevy_gas_template"
version = "0.1.0"
edition = "2024"
default-run = "bevy_gas_template"
publish = false

[features]
default = []
config-validation = ["dep:blake3", "dep:serde_json"]

[dependencies]
bevy = "0.19.1"
bevy_gas = { path = "../bevy_gas" }
blake3 = { version = "1.8.7", optional = true }
serde_json = { version = "1.0", optional = true }

[[bin]]
name = "gas-config"
path = "src/bin/gas_config.rs"
required-features = ["config-validation"]
